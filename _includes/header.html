<script>
  window.addEventListener('DOMContentLoaded', function () {
    const nav = document.getElementById('nav');
    if (!nav) return;

    const links = nav.querySelectorAll('a[href]');
    const path = window.location.pathname.replace(/\/+$/, ''); // 끝의 / 제거

    // 홈(/)일 때는 index.html도 같은 취급
    const normalizedPath = (path === '' ? '/' : path);

    let activeLink = null;

    links.forEach(a => {
      // relative_url로 렌더링된 실제 href를 기준으로 비교
      const hrefPath = new URL(a.getAttribute('href'), window.location.origin)
        .pathname
        .replace(/\/+$/, '');

      // 1) 완전 일치가 최우선
      if (hrefPath === normalizedPath) activeLink = a;

      // 2) 홈에서 /index.html 인 경우도 처리
      if (normalizedPath === '/' && (hrefPath === '/' || hrefPath === '/index.html')) {
        activeLink = a;
      }
    });

    // 기존 active 제거 후 현재 링크에 active 부여
    links.forEach(a => a.classList.remove('active'));
    if (activeLink) {
      activeLink.classList.add('active');
      activeLink.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
</script>
